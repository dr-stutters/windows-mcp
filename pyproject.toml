[project]
name = "windows-mcp"
version = "0.1.0"
description = "MCP server for Windows Server (AD DS, DNS, DHCP, AD CS) via WinRM/PowerShell remoting"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "pypsrp>=0.8.1",
    "python-dotenv>=1.0.0",
]

[project.scripts]
windows-mcp = "windows_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windows_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = ["ignore::ResourceWarning"]
